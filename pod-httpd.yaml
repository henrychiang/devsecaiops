
apiVersion: v1
kind: Pod
metadata:
  name: httpd-rhel7-pod
  labels:
    app: httpd-rhel7
spec:
  containers:
    - name: httpd
      image: registry.access.redhat.com/rhscl/httpd-24-rhel7:latest
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
  restartPolicy: Always
